operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
runtimeManifest:
  packages:
    dx-excshell-1:
      license: Apache-2.0
      actions:
        generic:
          function: actions/generic/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
          annotations:
            require-adobe-auth: true
            final: true
        analytics:
          function: actions/analytics/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
            apiKey: $SERVICE_API_KEY
          annotations:
            # Analytics is reached via the S2S service credential (include-ims-credentials),
            # not the end-user token, so we don't gate on user product profiles here.
            # See validateUser() in the action for lightweight token validation instead.
            require-adobe-auth: false
            final: true
            include-ims-credentials: true
